<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Authentication</title>
  </head>

  <body class="min-h-screen bg-red-500 text-app-text">
    <main class="auth-page">
      <div class="auth-container">
        <header class="auth-hero">
          <a href="/" class="auth-logo">SocialApp</a>

          <h1 class="auth-heading">Welcome back</h1>

          <p class="auth-lead">
            Sign in to continue, or create an account to join the community.
          </p>
        </header>

        <div class="auth-grid">
          <section class="auth-card">
            <h2 class="auth-card-title">Login</h2>

            <form action="/profile/">
              <input
                id="loginEmail"
                name="email"
                type="email"
                placeholder="email"
                required
              />

              <input
                id="loginPassword"
                name="password"
                type="password"
                placeholder="password"
                minlength="8"
                required
              />

              <button type="submit">Login</button>
            </form>
          </section>

          <section class="auth-card">
            <h2 class="auth-card-title">Register</h2>

            <form action="/profile/">
              <input
                id="name"
                name="name"
                type="text"
                placeholder="Name"
                required
              />

              <input
                id="registerEmail"
                name="email"
                type="email"
                placeholder="Email"
                required
              />

              <input
                id="registerPassword"
                name="password"
                type="password"
                placeholder="password"
                minlength="8"
                required
              />

              <input
                id="passwordConfirm"
                name="passwordConfirm"
                type="password"
                placeholder="Confirm password"
                minlength="8"
                required
              />

              <button type="submit">Register</button>
            </form>
          </section>
        </div>
      </div>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
